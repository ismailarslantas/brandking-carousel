name: Generate carousel

on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Repository-relative JSON plan path (public content only)'
        required: true
        default: examples/demo.json
        type: string

permissions:
  contents: read

jobs:
  generate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install free dependencies
        run: python -m pip install -r requirements.txt
      - name: Render selected plan
        env:
          CAROUSEL_PLAN: ${{ inputs.plan }}
        run: python scripts/run_workflow.py
      - name: Upload carousel delivery
        uses: actions/upload-artifact@v7
        with:
          name: brandking-carousel-${{ github.run_number }}
          path: outputs/carousel/
          retention-days: 1
          if-no-files-found: error
