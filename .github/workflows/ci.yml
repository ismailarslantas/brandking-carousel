name: Cross-platform checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install free dependencies
        run: python -m pip install -r requirements.txt
      - name: Test engine, audit and lint
        run: python -m unittest discover -s tests -v
      - name: Render every example with all checks on
        shell: bash
        run: |
          for plan in examples/*.json; do
            python -m brandking render "$plan" --output "outputs/$(basename "$plan" .json)"
          done
      - name: Older command still works
        run: python carousel.py --output outputs/shim
